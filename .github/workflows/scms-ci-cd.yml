name: SCMS CI/CD Pipeline (Sprint 1 + Sprint 2)

on:
  push:
    branches:
      - main
      - sprint1-user-complaint
      - 'ci/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - sprint1-user-complaint
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI (Tests & Security Verification)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      JWT_SECRET: scms-automated-ci-pipeline-token-secret-pes-group8
      PORT: 5001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure backend manifests and bootstrap files
        run: |
          if [ ! -f "backend/package.json" ]; then
            echo "backend/package.json not in current branch commit. Checking out bootstrap manifests from origin/main..."
            git fetch origin main || true
            git checkout origin/main -- backend/package.json backend/package-lock.json backend/app.js backend/server.js 2>/dev/null || true
          fi
          if [ ! -f "backend/package.json" ]; then
            echo "Error: backend/package.json could not be resolved."
            exit 1
          fi

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies reproducibly
        working-directory: backend
        run: npm ci

      - name: Execute automated test suite (Sprint 1 + Sprint 2 + E2E)
        working-directory: backend
        run: |
          echo "Running complete SCMS test suite across Sprint 1, Sprint 2, and Integration..."
          if [ -d "test/story_tests" ] && ls test/story_tests/*.test.js >/dev/null 2>&1; then
            node --test test/*.test.js test/story_tests/*.test.js
          else
            node --test test/*.test.js
          fi

  frontend-ci:
    name: Frontend CI (Lint & Production Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure frontend manifests and bootstrap files
        run: |
          if [ ! -f "frontend/package.json" ]; then
            echo "frontend/package.json not in current branch commit. Checking out bootstrap manifests from origin/main..."
            git fetch origin main || true
            git checkout origin/main -- frontend/package.json frontend/package-lock.json frontend/index.html frontend/vite.config.js frontend/src/components/ 2>/dev/null || true
          fi
          if [ ! -f "frontend/package.json" ]; then
            echo "Error: frontend/package.json could not be resolved."
            exit 1
          fi

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies reproducibly
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint checks
        working-directory: frontend
        run: npm run lint

      - name: Compile frontend production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload frontend production artifact
        uses: actions/upload-artifact@v4
        with:
          name: scms-frontend-production-dist
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error

  delivery-package:
    name: Continuous Delivery & Deployment Gate
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frontend production artifact
        uses: actions/download-artifact@v4
        with:
          name: scms-frontend-production-dist
          path: delivery/public

      - name: Package sanitized backend application bundle
        run: |
          mkdir -p delivery/backend
          # Copy application code while excluding environment secrets, git histories, local node_modules, and tests
          rsync -av --exclude='.git*' \
                    --exclude='.env*' \
                    --exclude='node_modules' \
                    --exclude='test' \
                    --exclude='*.log' \
                    backend/ delivery/backend/ || cp -R backend/* delivery/backend/

          # Clean any sensitive or unnecessary files
          rm -rf delivery/backend/node_modules delivery/backend/test delivery/backend/.env* 2>/dev/null || true
          
          # Include safe sample environment configuration
          if [ -f "backend/.env.example" ]; then
            cp backend/.env.example delivery/backend/.env.example
          fi

          echo "Delivery packaging completed successfully."
          ls -la delivery/
          ls -la delivery/backend/

      - name: Upload sanitized delivery bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: scms-delivery-bundle
          path: delivery/
          retention-days: 7

      - name: Deployment Gate Verification & Target Report
        run: |
          echo "============================================================"
          echo "SCMS CONTINUOUS DELIVERY VERIFICATION"
          echo "============================================================"
          echo "Artifacts generated:"
          echo " - Frontend: scms-frontend-production-dist (Vite static build)"
          echo " - Delivery: scms-delivery-bundle (Sanitized Express + React bundle)"
          echo ""
          echo "Deployment Gate Status:"
          echo " - Continuous Delivery artifact packaging: PASSED"
          echo " - Direct automated production deployment: GATED / PENDING"
          echo ""
          echo "Required deployment prerequisites for automated release:"
          echo " 1. Configure production hosting provider (e.g. Render / AWS / Vercel)."
          echo " 2. Configure GitHub Environment 'Production' with required secrets:"
          echo "    - MONGODB_URI (Production MongoDB connection string)"
          echo "    - JWT_SECRET (Cryptographically secure production signing key)"
          echo "    - DEPLOY_WEBHOOK_URL or CLOUD_PROVIDER_CREDENTIALS"
          echo " 3. Attach an authorized deployment step triggered on 'main' release tags."
          echo "============================================================"
